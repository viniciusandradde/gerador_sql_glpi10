<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador SQL GLPI 10</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h2 class="mb-4">Upload de Planilha (.xlsx) - Gerador SQL GLPI 10</h2>
  <form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="file" class="form-label">Escolha a planilha preenchida:</label>
      <input type="file" name="file" class="form-control" accept=".xlsx" required>
    </div>
    <button type="submit" class="btn btn-primary">Gerar Script SQL</button>
  </form>
  <hr>
  <p class="text-muted">A planilha deve conter as abas: base_dados, regras_sla, criterios_sla, acoes_sla, regras_grupo, criterios_grupo, acoes_grupo.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
