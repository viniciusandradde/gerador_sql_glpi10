<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Login - GLPI SQL</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container py-5"><h2>Login</h2>
<form method="POST"><div class="mb-3">
<input type="text" name="username" class="form-control" placeholder="Usuário" required></div>
<div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Senha" required></div>
<button type="submit" class="btn btn-primary">Entrar</button></form></div></body></html>
